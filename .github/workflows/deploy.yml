name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: firebase-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy Hosting and Firestore rules
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/gcp-key.json
        run: |
          if [ -z "$SERVICE_ACCOUNT" ]; then
            echo "Secret GitHub manquant : FIREBASE_SERVICE_ACCOUNT"
            exit 1
          fi
          printf '%s' "$SERVICE_ACCOUNT" > "$GOOGLE_APPLICATION_CREDENTIALS"
          npx --yes firebase-tools@15.32.1 deploy --only hosting,firestore:rules --project laurentburytraducteur --non-interactive
          rm -f "$GOOGLE_APPLICATION_CREDENTIALS"